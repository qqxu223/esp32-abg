; ESP32-S3 DNS 广告拦截器
; 目标硬件：ESP32-S3 N16R8（16MB flash + 8MB OPI PSRAM）
;
; 注意：不要把 secrets.h 提交到仓库。CI 会用 --project-option 从仓库 Secrets
; 注入 WEB_USER / WEB_PASS / OTA_PASS / WIFI_SSID / WIFI_PASS。

[platformio]
default_envs = s3

[env:s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; 16MB flash，双 OTA 分区（app 各 4MB，装得下规则包和后续扩展）
; littlefs 分区 6MB 由 partitions_s3_16mb.csv 决定，不在这里重复声明
board_build.partitions = partitions_s3_16mb.csv
board_build.filesystem = littlefs

; OPI PSRAM（N16R8 就是 QIO flash + OPI PSRAM）
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304

monitor_speed = 115200
upload_speed = 921600

build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  ; 串口走 USB-Serial/JTAG（板子是原生 USB），否则日志打到 UART0 引脚上看不到
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  bblanchon/ArduinoJson@^7.0.4

[env:s3-ota]
extends = env:s3
upload_protocol = espota
upload_port = adblock.local
